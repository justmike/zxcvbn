name: Trigger Pages Deployment

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    # Crucial step: ensures it only triggers if the master build actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Checkout the standalone gh-pages branch specifically to build from it
      - name: Checkout Standalone gh-pages Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # Upload the static contents of your gh-pages branch as a deployment artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Adjust this if your static files are inside a specific folder

      # Trigger the official pages-build-deployment run
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
