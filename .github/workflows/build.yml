# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # Adds a "Run workflow" button drop-down for manual triggering

# UPDATED: Added pages: write to grant access to the GitHub Pages deployment API
permissions:
  contents: write
  pages: write

jobs:
  build:
    name: Run build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install Node.js dependencies
        run: yarn --frozen-lockfile

      - name: Build source
        run: yarn build

      # ADDED: Step to trigger the native gh-pages branch deployment via the GitHub API
      - name: Trigger GitHub Pages (pages-build-deployment) Build & Deployment
        if: success() # Only triggers if all previous steps (like yarn build) succeed
# below fails during build with: "Resource not accessible by personal access token"
#        env:
#          GH_TOKEN: ${{ secrets.ZXCVBN_GH_PAGES_TRIGGER_TOKEN }}
#        run: gh api --method POST repos/${{ github.repository }}/pages/builds
# below fails during build with: "URL rejected: Port number was not a decimal number between 0 and 65535"
        run: |
          curl -f -i -X POST \
           -H "Accept: application/vnd.github+json" \
           -H "Authorization: Bearer ${{ secrets.ZXCVBN_GH_PAGES_TRIGGER_TOKEN }}" \
           -H "X-GitHub-Api-Version: 2022-11-28" \
           "https://api.github.com/repos/${{ github.repository }}/pages/builds"
